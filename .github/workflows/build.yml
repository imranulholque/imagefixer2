name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # makes icon.ico if the repository does not have one (so the build can never fail because of it)
      - name: Make icon if missing
        shell: python
        run: |
          import os
          if not os.path.exists("icon.ico"):
              from PIL import Image, ImageDraw
              s = 256
              im = Image.new("RGBA", (s, s), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle((0, 0, s - 1, s - 1), 56, fill=(99, 102, 241, 255))
              d.rounded_rectangle((56, 64, 200, 192), 20, outline="white", width=14)
              d.ellipse((92, 88, 116, 112), fill="white")
              d.polygon([(72, 176), (116, 132), (144, 160), (164, 140), (184, 176)], fill="white")
              im.save("icon.ico", sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
      # Opens the real window invisibly and clicks through the main features.
      # If something is wrong the log shows exactly where; the exe is still built.
      - name: Self test
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python smoke_test.py
      - run: pyinstaller --noconsole --onedir --name ImageFixer --icon icon.ico --collect-all pillow_heif --exclude-module tkinter app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ImageFixer
          path: dist/ImageFixer
